<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Transcribe speech in real time with Gemini Live."
    />
    <title>Speech to Text</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 64px auto;
      }

      header {
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #5263d9;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.8rem);
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 12px 0 0;
        color: #687187;
        line-height: 1.6;
      }

      .panel {
        padding: 28px;
        border: 1px solid #e3e7f0;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 50px #27345c0d;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      button {
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #5263d9;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #3f50c2;
      }

      button:focus-visible {
        outline: 3px solid #aeb8ff;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 24px;
        margin: 0;
        color: #687187;
        font-size: 0.92rem;
      }

      #status[data-kind="error"] {
        color: #b42318;
      }

      #history-status[data-kind="error"] {
        color: #b42318;
      }

      h2 {
        margin: 32px 0 12px;
        font-size: 1rem;
      }

      #transcript {
        min-height: 180px;
        padding: 18px;
        border: 1px solid #e3e7f0;
        border-radius: 12px;
        color: #28334a;
        background: #fafbfe;
        line-height: 1.7;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .history-panel {
        margin-top: 24px;
      }

      .history-heading,
      .history-card-heading,
      .history-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .history-heading h2 {
        margin: 0;
      }

      #history-status,
      .history-date {
        color: #687187;
        font-size: 0.9rem;
      }

      #history-list {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .history-card {
        padding: 18px;
        border: 1px solid #e3e7f0;
        border-radius: 12px;
        background: #fafbfe;
      }

      .history-card h3 {
        margin: 0;
        font-size: 1rem;
        overflow-wrap: anywhere;
      }

      .history-date {
        margin: 6px 0 12px;
      }

      .history-text {
        margin: 0;
        line-height: 1.6;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .history-card input,
      .history-card textarea {
        width: 100%;
        margin: 8px 0;
        padding: 10px 12px;
        border: 1px solid #cfd5e3;
        border-radius: 8px;
        color: inherit;
        font: inherit;
      }

      .history-card textarea {
        min-height: 120px;
        resize: vertical;
      }

      button.secondary {
        min-height: 38px;
        padding: 0 14px;
        color: #344054;
        background: #e9ecf4;
      }

      button.secondary:hover:not(:disabled) {
        background: #dce1ed;
      }

      button.danger {
        color: #b42318;
        background: #fee4e2;
      }

      button.danger:hover:not(:disabled) {
        background: #fecdca;
      }

      button.small {
        min-height: 34px;
        padding: 0 12px;
        font-size: 0.88rem;
      }

      @media (max-width: 520px) {
        main {
          margin: 32px auto;
        }

        .panel {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Live transcription</p>
        <h1>Speech to Text</h1>
        <p class="intro">
          Speak naturally in any supported language. Your transcript appears as
          Gemini processes your audio.
        </p>
      </header>

      <section class="panel" aria-labelledby="transcript-heading">
        <div class="controls">
          <button id="record-button" type="button">Start recording</button>
          <p id="status" role="status" aria-live="polite">
            Ready when you are.
          </p>
        </div>
        <h2 id="transcript-heading">Live transcript</h2>
        <div id="transcript" aria-live="polite" aria-atomic="false"></div>
      </section>

      <section class="panel history-panel" aria-labelledby="history-heading">
        <div class="history-heading">
          <h2 id="history-heading">Transcription history</h2>
          <p id="history-status" role="status" aria-live="polite">Loading history...</p>
        </div>
        <div id="history-list" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/recorder.js"></script>
  </body>
</html>
